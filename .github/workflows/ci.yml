name: Gatekeeper CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  gatekeeper-ci:
    name: Architecture & Unit Test Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - AST Architecture & Guardrails Audit (Gate 2)
        run: python .agents/skills/code-review/scripts/audit_guardrails.py

      - name: Step 2 - Documentation & ADR Sync Verification
        run: python .agents/skills/doc-sync/scripts/verify_doc_sync.py

      - name: Step 3 - White-box Unit Tests (100% Offline Mock)
        run: python -m unittest discover -s tests/unit -p "test_*.py" -v
