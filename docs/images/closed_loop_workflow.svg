<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1410" width="1340" height="1410" role="img" aria-labelledby="title desc" style="background:#0b1120; font-family:'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title id="title">閉環工作流分軌</title>
  <desc id="desc">AGENTS.md 分流表將請求導向簡單文件任務、規範變更、功能開發、缺陷修正與緊急止血五類；功能、缺陷、止血共用 Step 2 至 6，再經 Step 7 文檔同步後交付；規範變更走 G1 至 G6。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/>
    </marker>
    <style>
      .h1 { fill:#f1f5f9; font-size:30px; font-weight:700; }
      .sub { fill:#94a3b8; font-size:15px; }
      .bt { fill:#f1f5f9; font-size:16px; font-weight:700; }
      .bs { fill:#cbd5e1; font-size:13px; }
      .bx { fill:#cbd5e1; font-size:12.5px; }
      .mono { fill:#7dd3fc; font-size:13px; font-family:Consolas, 'Cascadia Mono', Menlo, monospace; }
      .tiny { fill:#94a3b8; font-size:11px; }
      .lg { fill:#94a3b8; font-size:13px; }
      .line { stroke:#94a3b8; stroke-width:2; fill:none; }
      .esc { stroke:#f59e0b; stroke-width:2; stroke-dasharray:6 4; fill:none; }
      .retry { stroke:#34d399; stroke-width:2; stroke-dasharray:6 4; fill:none; }
      .fail { stroke:#f472b6; stroke-width:2; fill:none; }
    </style>
  </defs>

  <!-- 標題 -->
  <text x="670" y="56" text-anchor="middle" class="h1">閉環工作流分軌 (Closed-Loop Tracks)</text>
  <text x="670" y="86" text-anchor="middle" class="sub">依 AGENTS.md 分流表判定軌別，讀取 .agents/workflows/ 對應流程檔後再開始</text>

  <!-- 輸入與分流 -->
  <rect x="470" y="116" width="400" height="56" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="670" y="150" text-anchor="middle" class="bt">【輸入】使用者請求</text>
  <line x1="670" y1="172" x2="670" y2="210" class="line" marker-end="url(#arrow)"/>

  <rect x="420" y="212" width="500" height="72" rx="12" fill="#0c1a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="670" y="242" text-anchor="middle" class="bt">AGENTS.md 第 2 節分流表</text>
  <text x="670" y="266" text-anchor="middle" class="bs">判斷不明時預設功能開發；交付時註明所走的流程檔</text>

  <path d="M670,284 V310 M150,310 H1190" class="line"/>
  <line x1="150" y1="310" x2="150" y2="338" class="line" marker-end="url(#arrow)"/>
  <line x1="410" y1="310" x2="410" y2="338" class="line" marker-end="url(#arrow)"/>
  <line x1="670" y1="310" x2="670" y2="338" class="line" marker-end="url(#arrow)"/>
  <line x1="930" y1="310" x2="930" y2="338" class="line" marker-end="url(#arrow)"/>
  <line x1="1190" y1="310" x2="1190" y2="338" class="line" marker-end="url(#arrow)"/>

  <!-- 五類請求 -->
  <rect x="30" y="340" width="240" height="78" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="150" y="368" text-anchor="middle" class="bt">簡單文件任務、問答</text>
  <text x="150" y="389" text-anchor="middle" class="bx">錯字、說明，不改規則或行為</text>
  <text x="150" y="408" text-anchor="middle" class="tiny">不需流程檔</text>

  <rect x="290" y="340" width="240" height="78" rx="10" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="410" y="368" text-anchor="middle" class="bt">規範變更</text>
  <text x="410" y="389" text-anchor="middle" class="bx">改 AGENTS.md、.agents/** 等</text>
  <text x="410" y="408" text-anchor="middle" class="mono">governance.md</text>

  <rect x="550" y="340" width="240" height="78" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="670" y="368" text-anchor="middle" class="bt">功能開發</text>
  <text x="670" y="389" text-anchor="middle" class="bx">新增或變更系統行為</text>
  <text x="670" y="408" text-anchor="middle" class="mono">feature.md</text>

  <rect x="810" y="340" width="240" height="78" rx="10" fill="#431407" stroke="#fb923c" stroke-width="1.5"/>
  <text x="930" y="368" text-anchor="middle" class="bt">缺陷修正（S2／S3）</text>
  <text x="930" y="389" text-anchor="middle" class="bx">既有行為違反規格或合理預期</text>
  <text x="930" y="408" text-anchor="middle" class="mono">bug.md</text>

  <rect x="1070" y="340" width="240" height="78" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/>
  <text x="1190" y="368" text-anchor="middle" class="bt">緊急止血（S1）</text>
  <text x="1190" y="389" text-anchor="middle" class="bx">資料損壞、個資外洩、全面失敗</text>
  <text x="1190" y="408" text-anchor="middle" class="mono">hotfix.md</text>

  <!-- 簡單文件 -->
  <line x1="150" y1="418" x2="150" y2="448" class="line" marker-end="url(#arrow)"/>
  <rect x="40" y="450" width="220" height="62" rx="10" fill="#111827" stroke="#64748b" stroke-width="1.5"/>
  <text x="150" y="476" text-anchor="middle" class="bt">不啟動閉環</text>
  <text x="150" y="498" text-anchor="middle" class="bs">直接處理並回覆</text>

  <!-- 規範變更 G1–G6 -->
  <line x1="410" y1="418" x2="410" y2="448" class="line" marker-end="url(#arrow)"/>
  <rect x="310" y="450" width="200" height="62" rx="10" fill="#0b2530" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="410" y="476" text-anchor="middle" class="bt">G1 提案</text>
  <text x="410" y="498" text-anchor="middle" class="bx">architect：動機、檔案、衝突</text>
  <line x1="410" y1="512" x2="410" y2="533" class="line" marker-end="url(#arrow)"/>

  <rect x="310" y="535" width="200" height="62" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="561" text-anchor="middle" class="bt">★ G2 人類核准</text>
  <text x="410" y="583" text-anchor="middle" class="bx">只有使用者能放行</text>
  <line x1="410" y1="597" x2="410" y2="618" class="line" marker-end="url(#arrow)"/>

  <rect x="310" y="620" width="200" height="62" rx="10" fill="#0b2530" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="410" y="646" text-anchor="middle" class="bt">G3 修改</text>
  <text x="410" y="668" text-anchor="middle" class="bx">正本 → 轉接層、鏡像、索引</text>
  <line x1="410" y1="682" x2="410" y2="703" class="line" marker-end="url(#arrow)"/>

  <rect x="310" y="705" width="200" height="62" rx="10" fill="#0b2530" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="410" y="731" text-anchor="middle" class="bt">G4 一致性檢查</text>
  <text x="410" y="753" text-anchor="middle" class="bx">verify_doc_sync 等 6 項</text>
  <line x1="410" y1="767" x2="410" y2="788" class="line" marker-end="url(#arrow)"/>

  <rect x="310" y="790" width="200" height="62" rx="10" fill="#0b2530" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="410" y="816" text-anchor="middle" class="bt">G5 審查</text>
  <text x="410" y="838" text-anchor="middle" class="bx">gatekeeper：矛盾、重複</text>
  <line x1="410" y1="852" x2="410" y2="873" class="line" marker-end="url(#arrow)"/>

  <rect x="310" y="875" width="200" height="62" rx="10" fill="#0b2530" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="410" y="901" text-anchor="middle" class="bt">G6 交付</text>
  <text x="410" y="923" text-anchor="middle" class="bx">小改：PR／大改：規格＋QA</text>

  <path d="M310,821 H298 V651 H306" class="retry" marker-end="url(#arrowGreen)"/>
  <text x="293" y="740" text-anchor="middle" class="tiny" transform="rotate(-90 293 740)">未通過退回</text>

  <!-- 功能開發 Step 1 + Gate 1 -->
  <line x1="670" y1="418" x2="670" y2="448" class="line" marker-end="url(#arrow)"/>
  <rect x="560" y="450" width="220" height="112" rx="10" fill="#1a1745" stroke="#818cf8" stroke-width="1.5"/>
  <text x="670" y="476" text-anchor="middle" class="bt">Step 1 需求規格化</text>
  <text x="670" y="497" text-anchor="middle" class="mono">feature-design</text>
  <text x="670" y="521" text-anchor="middle" class="bs">PRD＋Tech Spec</text>
  <text x="670" y="543" text-anchor="middle" class="bs">QA 驗收案例矩陣</text>
  <line x1="670" y1="562" x2="670" y2="583" class="line" marker-end="url(#arrow)"/>
  <rect x="560" y="585" width="220" height="56" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <text x="670" y="609" text-anchor="middle" class="bt">★ Gate 1 架構前審</text>
  <text x="670" y="630" text-anchor="middle" class="bx">未達標 → 退回 Step 1</text>

  <!-- 缺陷修正 Step 1B -->
  <line x1="930" y1="418" x2="930" y2="448" class="line" marker-end="url(#arrow)"/>
  <rect x="820" y="450" width="220" height="191" rx="10" fill="#2c1006" stroke="#fb923c" stroke-width="1.5"/>
  <text x="930" y="476" text-anchor="middle" class="bt">Step 1B 缺陷分析</text>
  <text x="930" y="497" text-anchor="middle" class="mono">bug-triage</text>
  <text x="838" y="522" class="bs">① 受理與分級</text>
  <text x="838" y="544" class="bs">② 重現（不能重現即停）</text>
  <text x="838" y="566" class="bs">③ 紅燈回歸測試</text>
  <text x="838" y="588" class="bs">④ 根因與逃逸分析</text>
  <text x="838" y="610" class="bs">⑤ 修正範圍、升級判斷</text>
  <text x="838" y="632" class="bs">⑥ 簡化 Gate 1</text>

  <line x1="820" y1="505" x2="782" y2="505" class="esc" marker-end="url(#arrowAmber)"/>
  <text x="801" y="495" text-anchor="middle" class="tiny" style="fill:#fbbf24">升級</text>
  <text x="801" y="522" text-anchor="middle" class="tiny" style="fill:#fbbf24">需確認</text>

  <!-- 緊急止血 -->
  <line x1="1190" y1="418" x2="1190" y2="448" class="line" marker-end="url(#arrow)"/>
  <rect x="1080" y="450" width="220" height="191" rx="10" fill="#2d0808" stroke="#f87171" stroke-width="1.5"/>
  <text x="1190" y="476" text-anchor="middle" class="bt">以 bug.md 為基礎</text>
  <text x="1190" y="497" text-anchor="middle" class="tiny">只列縮減與追加之處</text>
  <text x="1096" y="522" class="bs">1B：重現、紅燈測試</text>
  <text x="1096" y="542" class="bs">　　不可省；RCA 可摘要</text>
  <text x="1096" y="566" class="bs">QA：縮為冒煙測試</text>
  <text x="1096" y="590" class="bs">Gate 2：完整執行</text>
  <text x="1096" y="614" class="bs">合併後 3 個工作天內</text>
  <text x="1096" y="634" class="bs">　　補齊 RCA 與 QA</text>

  <!-- 匯入共用段 -->
  <path d="M670,641 V670 M930,641 V670 M1190,641 V670 M670,670 H1190" class="line"/>
  <line x1="765" y1="670" x2="765" y2="728" class="line" marker-end="url(#arrow)"/>

  <!-- 共用 Step 2–6 -->
  <rect x="550" y="690" width="760" height="360" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="566" y="712" class="tiny">Step 2–6 共用（功能、缺陷、止血使用同一套技能與標準）</text>

  <rect x="600" y="730" width="330" height="56" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="765" y="754" text-anchor="middle" class="bt">Step 2 實作（developer）</text>
  <text x="765" y="775" text-anchor="middle" class="bx">依規格；Bug 軌只改修正範圍內的檔案</text>
  <line x1="765" y1="786" x2="765" y2="808" class="line" marker-end="url(#arrow)"/>

  <rect x="600" y="810" width="330" height="56" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="765" y="834" text-anchor="middle" class="bt">Step 3 單元測試</text>
  <text x="765" y="855" text-anchor="middle" class="bx">unit-testing：100% 離線 Mock；紅燈須轉綠</text>
  <line x1="765" y1="866" x2="765" y2="888" class="line" marker-end="url(#arrow)"/>

  <rect x="600" y="890" width="330" height="56" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="765" y="914" text-anchor="middle" class="bt">Step 4 QA 實測（gatekeeper）</text>
  <text x="765" y="935" text-anchor="middle" class="bx">qa-testing：RTM 覆蓋 AC（Bug 軌為 BC-*）</text>
  <line x1="765" y1="946" x2="765" y2="968" class="line" marker-end="url(#arrow)"/>

  <rect x="600" y="970" width="330" height="60" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <text x="765" y="996" text-anchor="middle" class="bt">★ Step 5 Gate 2 對抗式審查</text>
  <text x="765" y="1018" text-anchor="middle" class="bx">任何軌別不可省；零 P0 才放行</text>

  <rect x="1000" y="800" width="280" height="210" rx="10" fill="#2a0f22" stroke="#f472b6" stroke-width="1.5"/>
  <text x="1140" y="866" text-anchor="middle" class="bt">Step 6 自主修正</text>
  <text x="1140" y="888" text-anchor="middle" class="mono">auto-fix（developer）</text>
  <text x="1140" y="914" text-anchor="middle" class="bs">RCA；嚴禁削弱斷言</text>
  <text x="1140" y="938" text-anchor="middle" class="bs">三振熔斷 → 交由使用者</text>

  <line x1="930" y1="852" x2="998" y2="852" class="fail" marker-end="url(#arrowPink)"/>
  <text x="964" y="846" text-anchor="middle" class="tiny" style="fill:#f9a8d4">失敗</text>
  <line x1="930" y1="918" x2="998" y2="918" class="fail" marker-end="url(#arrowPink)"/>
  <text x="964" y="912" text-anchor="middle" class="tiny" style="fill:#f9a8d4">失敗</text>
  <line x1="930" y1="1000" x2="998" y2="1000" class="fail" marker-end="url(#arrowPink)"/>
  <text x="964" y="994" text-anchor="middle" class="tiny" style="fill:#f9a8d4">有 P0</text>
  <line x1="1000" y1="822" x2="932" y2="822" class="retry" marker-end="url(#arrowGreen)"/>
  <text x="964" y="816" text-anchor="middle" class="tiny" style="fill:#6ee7b7">重跑</text>

  <!-- Step 7 -->
  <line x1="765" y1="1030" x2="765" y2="1088" class="line" marker-end="url(#arrow)"/>
  <rect x="560" y="1090" width="740" height="98" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="930" y="1116" text-anchor="middle" class="bt">Step 7 文檔同步（doc-sync，architect）</text>
  <text x="930" y="1142" text-anchor="middle" class="bs">功能開發：REQUIREMENTS、ARCHITECTURE、ADR、docs/README 索引</text>
  <text x="930" y="1166" text-anchor="middle" class="bs">缺陷修正／止血：缺陷報告結案、缺陷索引；不產出 ADR</text>

  <!-- 交付 -->
  <line x1="930" y1="1188" x2="930" y2="1228" class="line" marker-end="url(#arrow)"/>
  <line x1="410" y1="937" x2="410" y2="1228" class="line" marker-end="url(#arrow)"/>
  <rect x="300" y="1230" width="1000" height="74" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="800" y="1260" text-anchor="middle" class="bt">【交付】</text>
  <text x="800" y="1286" text-anchor="middle" class="bs">註明所走流程檔，附可點擊連結、QA 實測摘要與 Gate 2 審查摘要（規範變更附 G4／G5 結果）</text>

  <!-- 圖例 -->
  <rect x="300" y="1334" width="22" height="16" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <text x="330" y="1347" class="lg">人類核准或門禁</text>
  <line x1="470" y1="1342" x2="510" y2="1342" class="esc" marker-end="url(#arrowAmber)"/>
  <text x="518" y="1347" class="lg">升級回功能開發（需使用者確認）</text>
  <line x1="760" y1="1342" x2="800" y2="1342" class="fail" marker-end="url(#arrowPink)"/>
  <text x="808" y="1347" class="lg">失敗送修</text>
  <line x1="900" y1="1342" x2="940" y2="1342" class="retry" marker-end="url(#arrowGreen)"/>
  <text x="948" y="1347" class="lg">修正後重跑／退回</text>
  <text x="670" y="1386" text-anchor="middle" class="tiny">正本：AGENTS.md 第 2 節、.agents/workflows/*.md；步驟作業細節以各技能為準</text>
</svg>
