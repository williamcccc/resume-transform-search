# 閉環專案設定（Spec-0028）
# 本檔是閘門腳本（audit_guardrails.py、verify_doc_sync.py）所有專案專屬值的唯一正本。
# 移植到其他專案時，依 .agents/PORTING.md 逐鍵改寫；腳本找不到本檔或缺鍵時會以結束碼 2 中止。

[layers]
# DDD 四層分層檢查（Domain 純潔性、Application 依賴反轉）。false 只關閉自動檢查（如逐步導入 DDD），
# 閉環核心仍以 DDD 為前提（見 PORTING.md 適用範圍）。
enabled = true
# 原始碼掃描根目錄；enabled = false 時仍用於資源、例外、硬編碼與提示詞檢查。
# 選填 package（Spec-0047）：src 目錄對應之 import 根名；未設定時由 src 推導，
# src-layout 或四層位於倉庫根（src = "."、package = ""）時須宣告。本專案以 src.* 引用，不必設定。
src = "src"
domain = "src/domain"
application = "src/application"
infrastructure = "src/infrastructure"
interfaces = "src/interfaces"
# Domain 契約檔（Protocol 介面）
domain_interfaces = "src/domain/interfaces.py"

[config]
# 設定模組（集中讀取環境變數）；原始碼以字串常值讀取之環境變數須全數列於 env_example（Spec-0039）。
module = "src/infrastructure/config.py"
env_example = ".env.example"

[guardrails]
# 原始碼禁止寫死的連線 URL scheme
url_schemes = ["redis", "postgres", "postgresql", "mongodb", "amqp", "http", "https"]
# 金鑰格式（正規式）；命中即 P0
api_key_patterns = ['AQ\.[a-zA-Z0-9_-]{20,}', 'AIzaSy[a-zA-Z0-9_-]{33}']
# 長度 >= 20 的字串常數含以下片語，視為寫死提示詞
prompt_indicators = [
    "你是一個",
    "你是一位",
    "你扮演",
    "請遵守以下規則",
    "遵守以下規則",
    "<resume_content",
    "</resume_content>",
    "自我修復後的",
    "請對照原始資料",
    "你是一個專業的",
    "=== 原始文件資訊",
    "=== 待審核",
    "=== 原始提取文字",
]
# 只列於評測專用 requirements、原始碼禁止 import 的套件
eval_only_modules = ["ragas"]
# .gitignore 必備項目（AGENTS.md 紅線 7 之唯一正本）
required_gitignore = [
    ".env",
    "data/",
    "resume/",
    "resumes/",
    "output/",
    "output_md/",
    "markdown_out/",
    "markdown_output/",
    "quarantine/",
    "scorecards/",
    "logs/",
    "dump.rdb",
    "appendonlydir/",
]
# 全倉隱私掃描略過的目錄名稱
ignore_scan_dirs = [
    ".git",
    ".venv",
    ".venv-eval",
    ".venv-tools",
    "__pycache__",
    ".pytest_cache",
    "data",
    "resume",
    "resumes",
    "output",
    "output_md",
    "markdown_out",
    "markdown_output",
    "quarantine",
    "scorecards",
    "logs",
    "scratch",
    ".vscode",
]

# 允許寫死連線 URL 的檔案；每筆必填 reason。
[[guardrails.url_exceptions]]
path = "src/infrastructure/stores/redis_vector_store.py"
reason = "建構子 redis_url 參數的本機開發預設值；正式連線一律由 AppConfig 注入覆寫"

[privacy]
# 受保護身分之 SHA-256 前 16 碼指紋（3～4 字 CJK 片段）。移植時必須清空。
forbidden_hash_prefixes = [
    "03e6e7b373fdf9b2",
    "fd33828acba22b0c",
    "7bc129af776b874e",
    "b9820ab4f19e7ac7",
    "6862896e289fdce0",
    "ab41d159b7aabb68",
]
safe_email_domains = ["example.com", "example.org", "example.net", "invalid", "localhost"]
# 檔名主幹屬於以下通用字詞時，不視為個人檔名
safe_filename_stems = [
    "sample", "example", "demo", "test", "fake", "mock", "bad", "large",
    "corrupt", "invalid", "fixture", "candidate", "document", "source", "output",
    "converted", "file", "input", "resume", "sample_resume", "candidate_one",
]
# 存放真實原始檔或其產出的目錄名稱（路徑任一層命中即算）；引用其下 .pdf/.docx/.doc/.md 實際檔名即視為隱私線索。
# 只列直接存放檔案的目錄：根目錄 data/ 不列（tests/eval/data/ 為合成評測資料，列入會誤報），改列其下子目錄。
sensitive_dirs = ["resume", "resumes", "markdown_out", "markdown_output", "output_md", "quarantine"]
# 敏感目錄下引用以下副檔名之實際檔名即視為隱私線索（不含點）
sensitive_extensions = ["pdf", "docx", "doc", "md"]
# 「人名-關鍵字」形式的個人檔名關鍵字
personal_filename_keywords = ["CV", "resume"]
# 啟用的地區樣式組（audit_guardrails.py 內建）：tw_mobile、tw_landline、tw_id
locale_patterns = ["tw_mobile", "tw_landline", "tw_id"]

[project]
# 本專案業務技能（.agents/skills/ 與 .claude/skills/ 下同名資料夾）；移植時依此清單刪除後清空
business_skills = ["resume-vector-indexing", "resume-vector-search"]
# 中性化守護字詞（Spec-0041；正規式，單引號字面字串）。移植時改為新專案的字詞，無則清空。
# identifiers：本專案業務名詞、檔名、類別名、規格值與原始碼路徑；核心 Markdown（實例檔、業務技能、本專案紅線小節除外）不得出現
identifiers = [
    '履歷', '候選人', '求職', '招募', 'resume', 'Resume', 'AppConfig',
    'convert_to_md', 'index_to_redis', 'search_resumes', 'idx:resumes', '_escape_redis_tag',
    'GeminiJudgeService', 'RedisVectorStore', 'IVectorStore', 'IQualityValidator', 'IEmbeddingService', 'ResumeChunk',
    'PyMuPDF', 'pymupdf', '\b768\b', '(?<!功能)切片', 'src\.domain', '\bsrc/', '(?<![\w/.])data/',
]
# stack_terms：本專案技術元件名；須技術中立之核心檢核清單不得出現，其他核心文件可作通用舉例
stack_terms = ['Redis', 'Gemini', 'PDF', 'Docx', 'DOCX']

[docs]
# 規格編號達此值起，須宣告「品質評測範圍」且缺漏即 FAIL
quality_ac_enforced_from = 23
# 規格編號達此值起，須宣告「安全評估範圍」且缺漏即 FAIL（Spec-0030；新專案設為 1）
security_ac_enforced_from = 31
# AGENTS.md 行數上限，超過時 WARN
agents_max_lines = 200

[security]
# 專案安全特徵（Spec-0030）。移植時逐項回答；適用標準由
# .agents/skills/feature-design/references/security_nfr_framework.md 第四節對照決定。
# OWASP ASVS 驗證等級：本機單人工具取 1；對外服務建議 2
asvs_level = 1
# 網路暴露範圍：local（僅本機）| lan（內網）| internet（對外）。改變時須重新評估全專案
network_exposure = "local"
web_interface = true             # 提供 Web 頁面或瀏覽器可存取之端點
api_service = true               # 提供 HTTP API
uses_llm = true                  # 呼叫 LLM 或處理 LLM 輸出
handles_pii = true               # 處理個人資料
processes_untrusted_files = true # 解析使用者提供之檔案
multi_user = false               # 多使用者或需區分身分

# 有使用之「技術」條件 ASVS 章節（如 "V9"）；技術章節須列於此或下方 not_applicable 之一（Spec-0034，verify_doc_sync.py 檢查）
tech_chapters_in_use = []

# 不適用之標準章節；每筆必填 reason。只登錄「技術條件章節未使用」或「特徵判定適用但另有理由排除」者
# （規則見 security_nfr_framework.md 第四節）；依特徵已判定不適用者不必登錄。特徵改變時須重新檢視
[[security.not_applicable]]
item = "ASVS V9 自包含權杖、V10 OAuth 與 OIDC、V17 WebRTC"
reason = "未使用權杖、第三方登入或 WebRTC"

[security.tools]
# Gate 2 安全掃描（security_scan.py）。工具裝在獨立虛擬環境，避免與執行期相依衝突：
#   python -m venv .venv-tools
#   .venv-tools/Scripts/python -m pip install -r requirements-dev.txt   （POSIX 為 .venv-tools/bin/python）
# 找不到時退回 PATH 上的同名指令
tools_venv = ".venv-tools"
# 靜態掃描範圍（專案相對路徑）
scan_paths = ["src", "convert_to_md.py", "index_to_redis.py", "search_resumes.py", "web_dashboard.py"]
# Semgrep 規則集
semgrep_configs = ["p/python", "p/owasp-top-ten"]
# 新增發現達此嚴重度即 P0，其餘 P1
semgrep_block_severities = ["ERROR"]
# 依賴漏洞掃描之需求檔
dependency_files = ["requirements.txt", "requirements-eval.txt", "requirements-dev.txt"]
# 依賴套件新增已知漏洞之等級（pip-audit 不提供嚴重度）
dependency_level = "P1"
# 既有發現基準檔：只阻斷新增發現；每筆須有理由與到期日
baseline = ".agents/project/security_baseline.json"
# 觸發方式（Spec-0030 決議 10）：預設差異掃描——Semgrep 只掃相對 diff_base 之變更檔，
# pip-audit 只在 dependency_files 變更時執行；上次完整掃描超過下列天數即自動完整掃描
diff_base = "main"
full_scan_max_age_days = 7
